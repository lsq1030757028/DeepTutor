; 本文件的作用是**把 rootdir 钉在这里**，不是为了配置什么。
;
; 搬进 fork 之后实测：从本目录跑 pytest 会向上找到仓库根的 pyproject.toml，
; 于是继承了上游 DeepTutor 的 pytest 配置（`asyncio_default_fixture_loop_scope`
; 等依赖 pytest-asyncio 的项），直接报 `Unknown config option` 且一条用例都收不到。
;
; pytest 找到第一个 ini 文件就停止上溯，所以这个文件让两套测试各用各的配置：
; 上游的归上游，我们的归我们。属新增文件，与上游零冲突。

[pytest]
testpaths = tests
