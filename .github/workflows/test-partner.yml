name: DeepTutor Test Partner CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deeptutor-test-partner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  regression:
    name: Test Partner main regression + real browser
    runs-on: ubuntu-latest
    # Historical duration ~3-4 min; 5x margin so a wedged run cannot hold the
    # required check open until GitHub's 6h default.
    timeout-minutes: 20

    steps:
      - name: Validate event-bound source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::SOURCE_SHA must be a full lowercase 40-character SHA"
            exit 64
          }
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$SOURCE_SHA" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi

      - name: Checkout exact event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Zero-credential tracked-file check
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'extensions/test-partner/**' \
            | grep -iE '(^|/)(secrets\.env|environments\.json|gateway\.json)$' \
            | grep -v '[.]example$' || true)
          if [[ -n "$tracked" ]]; then
            echo "::error::credential-like Test Partner files are tracked: $tracked"
            exit 1
          fi
          hars=$(git ls-files 'extensions/test-partner/**' \
            | grep -i '[.]har$' \
            | grep -v '^extensions/test-partner/tests/fixtures/' || true)
          if [[ -n "$hars" ]]; then
            echo "::error::HAR originals outside tests/fixtures are tracked: $hars"
            exit 1
          fi

      - name: Test Partner main regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.11-bookworm \
            sh -c 'owner="$(stat -c "%u:%g" /workspace)"; trap "chown -R $owner /workspace" EXIT; git --version; python -m pip install -q -r extensions/test-partner/requirements-dev.txt; cd extensions/test-partner; python -m pytest -q --no-header -k "not test_ui_track_real_browser" --junitxml=/workspace/ci-artifacts/test-partner.xml'

      - name: Test Partner real Chromium regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e PLAYWRIGHT_BROWSERS_PATH=/tmp/ms-playwright \
            python:3.11-bookworm \
            sh -c 'owner="$(stat -c "%u:%g" /workspace)"; trap "chown -R $owner /workspace" EXIT; printf "Acquire::Retries \"5\";\nAcquire::https::Timeout \"30\";\n" > /etc/apt/apt.conf.d/80-ci-retries; sed -i "s|http://deb.debian.org|https://deb.debian.org|g" /etc/apt/sources.list.d/debian.sources; python -m pip install -q -r extensions/test-partner/requirements-dev.txt; n=0; until python -m playwright install --with-deps chromium; do n=$((n+1)); test "$n" -lt 3 || exit 1; done; cd extensions/test-partner; python -m pytest -q --no-header tests/test_journey_exec.py::test_ui_track_real_browser --junitxml=/workspace/ci-artifacts/test-partner-browser.xml'

      - name: Upload Test Partner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deeptutor-test-partner-${{ env.SOURCE_SHA }}
          path: ci-artifacts/test-partner*.xml
          if-no-files-found: warn
