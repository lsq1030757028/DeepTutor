name: DeepTutor root and web CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deeptutor-root-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  regression:
    name: root pytest + web UAT gate
    runs-on: [self-hosted, linux, x64, deeptutor-ci]

    steps:
      - name: Validate event-bound source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::SOURCE_SHA must be a full lowercase 40-character SHA"
            exit 64
          }
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$SOURCE_SHA" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi

      - name: Checkout exact event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Linux root pytest regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e PYTHONPATH=/workspace \
            python:3.11 \
            sh -c 'owner="$(stat -c "%u:%g" /workspace)"; trap "chown -R $owner /workspace" EXIT; git --version; python -m pip install -q -r requirements/server.txt -r requirements/partners.txt pytest pytest-asyncio; mkdir -p data/user/settings; printf "system:\n  language: en\nlogging:\n  level: WARNING\n" > data/user/settings/main.yaml; python -m pytest -q tests deeptutor/learning/tests --junitxml=/workspace/ci-artifacts/root-linux.xml'

      - name: Web UAT gate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/web \
            -e HOME=/tmp \
            -e NEXT_TELEMETRY_DISABLED=1 \
            node:22.12.0 \
            sh -c 'owner="$(stat -c "%u:%g" /workspace)"; trap "chown -R $owner /workspace" EXIT; npm ci --legacy-peer-deps; npm run test:node; npm run i18n:parity; npm run build; npm run perf:check'

      - name: Upload root pytest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deeptutor-root-pytest-${{ env.SOURCE_SHA }}
          path: ci-artifacts/root-linux.xml
          if-no-files-found: warn
